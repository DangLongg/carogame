<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎮 Caro AI 20x20</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#141E30,#243B55);
    min-height:100vh;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px;
}

h1{
    margin-bottom:15px;
    font-size:40px;
}

.panel{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
}

.card{
    background:rgba(255,255,255,0.08);
    padding:15px 25px;
    border-radius:15px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 15px rgba(255,255,255,.1);
}

.card h3{
    margin-bottom:10px;
}

.score{
    font-size:20px;
    font-weight:600;
}

#status{
    margin-bottom:15px;
    font-size:24px;
    font-weight:700;
}

#board{
    display:grid;
    grid-template-columns:repeat(20,32px);
    grid-template-rows:repeat(20,32px);

    gap:1px;

    background:#444;

    padding:3px;

    border-radius:10px;

    box-shadow:
    0 0 25px rgba(255,255,255,.15);
}

.cell{
    width:32px;
    height:32px;

    background:white;

    display:flex;
    justify-content:center;
    align-items:center;

    cursor:pointer;

    user-select:none;

    font-size:20px;
    font-weight:bold;

    transition:.2s;
}

.cell:hover{
    background:#ececec;
}

.x{
    color:#ff4d6d;
}

.o{
    color:#4cc9f0;
}

.win{
    background:#ffe66d !important;
    animation:pulse .6s infinite alternate;
}

@keyframes pulse{
    from{
        transform:scale(1);
    }
    to{
        transform:scale(1.1);
    }
}

button{
    margin-top:20px;

    padding:12px 30px;

    border:none;

    border-radius:10px;

    cursor:pointer;

    font-size:18px;

    font-weight:600;

    background:#06d6a0;

    color:white;

    transition:.25s;
}

button:hover{
    transform:scale(1.05);
}

@media(max-width:900px){

    #board{
        grid-template-columns:repeat(20,24px);
        grid-template-rows:repeat(20,24px);
    }

    .cell{
        width:24px;
        height:24px;
        font-size:16px;
    }
}

</style>
</head>

<body>

<h1>🎮 CARO GAMEE=))</h1>

<div class="panel">

    <div class="card">
        <h3>👤 DangLongdz😆</h3>
        <div class="score" id="playerScore">0</div>
    </div>

    <div class="card">
        <h3>🤖 Bot ngu😏</h3>
        <div class="score" id="botScore">0</div>
    </div>

    <div class="card">
        <h3>🤝 Hòa</h3>
        <div class="score" id="drawScore">0</div>
    </div>

</div>

<div id="status">
Lượt của bạn (X)
</div>

<div id="board"></div>

<button onclick="resetGame()">
🔄 Chơi lại
</button>

<script>

const SIZE = 20;

let board = [];

let gameOver = false;

let playerScore = 0;
let botScore = 0;
let drawScore = 0;

let winCells = [];

const boardElement =
document.getElementById("board");

const statusElement =
document.getElementById("status");

const playerScoreElement =
document.getElementById("playerScore");

const botScoreElement =
document.getElementById("botScore");

const drawScoreElement =
document.getElementById("drawScore");

function createBoard(){

    board = [];

    boardElement.innerHTML = "";

    for(let r=0;r<SIZE;r++){

        board[r] = [];

        for(let c=0;c<SIZE;c++){

            board[r][c] = "";

            const cell = document.createElement("div");

            cell.className = "cell";

            cell.dataset.row = r;
            cell.dataset.col = c;

            cell.addEventListener("click",playerMove);

            boardElement.appendChild(cell);
        }
    }

    gameOver = false;
    winCells = [];

    statusElement.textContent =
    "Lượt của bạn (X)";
}

function resetGame(){
    createBoard();
}

createBoard();

function playerMove(){

    if(gameOver) return;

    const row =
    parseInt(this.dataset.row);

    const col =
    parseInt(this.dataset.col);

    if(board[row][col] !== "")
        return;

    placeMove(row,col,"X");

    const result =
    checkWinner(row,col,"X");

    if(result){
        playerWin(result);
        return;
    }

    statusElement.textContent =
    "🤖 Bot đang suy nghĩ...";

    setTimeout(botMove,250);
}

function placeMove(row,col,player){

    board[row][col] = player;

    const index =
    row*SIZE + col;

    const cell =
    boardElement.children[index];

    cell.textContent = player;

    cell.classList.add(
        player.toLowerCase()
    );
}

function checkWinner(row,col,player){

    const dirs = [

        [1,0],
        [0,1],
        [1,1],
        [1,-1]

    ];

    for(const [dx,dy] of dirs){

        let cells =
        [[row,col]];

        let count = 1;

        let r=row+dx;
        let c=col+dy;

        while(
            r>=0 &&
            r<SIZE &&
            c>=0 &&
            c<SIZE &&
            board[r][c]===player
        ){
            count++;
            cells.push([r,c]);

            r+=dx;
            c+=dy;
        }

        r=row-dx;
        c=col-dy;

        while(
            r>=0 &&
            r<SIZE &&
            c>=0 &&
            c<SIZE &&
            board[r][c]===player
        ){
            count++;
            cells.push([r,c]);

            r-=dx;
            c-=dy;
        }

        if(count>=5)
            return cells;
    }

    return null;
}

function highlightWin(cells){

    for(const [r,c] of cells){

        const index =
        r*SIZE+c;

        boardElement
        .children[index]
        .classList.add("win");
    }
}

function fireworks(){

    confetti({
        particleCount:250,
        spread:180,
        origin:{y:.6}
    });

    setTimeout(()=>{
        confetti({
            particleCount:200,
            spread:120
        });
    },400);
}

function playerWin(cells){

    gameOver = true;

    highlightWin(cells);

    fireworks();

    playerScore++;

    playerScoreElement.textContent =
    playerScore;

    statusElement.textContent =
    "🎉 Bạn thắng!";
}

function botWin(cells){

    gameOver = true;

    highlightWin(cells);

    botScore++;

    botScoreElement.textContent =
    botScore;

    statusElement.textContent =
    "🤖 Bot thắng!";
}

function getCandidates(){

    let set = new Set();

    let hasPiece = false;

    for(let r=0;r<SIZE;r++){

        for(let c=0;c<SIZE;c++){

            if(board[r][c]!=""){

                hasPiece = true;

                for(let dr=-2;dr<=2;dr++){

                    for(let dc=-2;dc<=2;dc++){

                        let nr=r+dr;
                        let nc=c+dc;

                        if(
                            nr>=0 &&
                            nr<SIZE &&
                            nc>=0 &&
                            nc<SIZE &&
                            board[nr][nc]==""
                        ){
                            set.add(
                                nr+","+nc
                            );
                        }
                    }
                }
            }
        }
    }

    if(!hasPiece){

        return [[10,10]];
    }

    return [...set]
    .map(v=>v.split(",")
    .map(Number));
}

const attack =
[0,10,100,1000,100000,99999999];

const defend =
[0,8,80,900,90000,99999999];

function countDirection(
r,c,dx,dy,player
){

    let count = 0;

    let nr=r+dx;
    let nc=c+dy;

    while(
        nr>=0 &&
        nr<SIZE &&
        nc>=0 &&
        nc<SIZE &&
        board[nr][nc]===player
    ){
        count++;

        nr+=dx;
        nc+=dy;
    }

    return count;
}

function evaluateCell(
r,c
){

    let score = 0;

    const dirs=[
        [1,0],
        [0,1],
        [1,1],
        [1,-1]
    ];

    for(const [dx,dy] of dirs){

        let a1=
        countDirection(
        r,c,dx,dy,"O");

        let a2=
        countDirection(
        r,c,-dx,-dy,"O");

        let attackCount=
        a1+a2;

        score+=
        attack[
        Math.min(
        attackCount,5)];

        let d1=
        countDirection(
        r,c,dx,dy,"X");

        let d2=
        countDirection(
        r,c,-dx,-dy,"X");

        let defendCount=
        d1+d2;

        score+=
        defend[
        Math.min(
        defendCount,5)];
    }

    return score;
}

function botMove(){

    if(gameOver)
        return;

    let bestScore = -1;

    let bestMove = null;

    const candidates =
    getCandidates();

    for(const [r,c]
        of candidates){

        const score =
        evaluateCell(r,c);

        if(score >
           bestScore){

            bestScore =
            score;

            bestMove =
            [r,c];
        }
    }

    if(!bestMove){

        drawGame();
        return;
    }

    const [row,col] =
    bestMove;

    placeMove(
    row,col,"O");

    const result =
    checkWinner(
    row,col,"O");

    if(result){

        botWin(result);

        return;
    }

    statusElement.textContent =
    "Lượt của bạn (X)";
}

function drawGame(){

    drawScore++;

    drawScoreElement.textContent =
    drawScore;

    gameOver = true;

    statusElement.textContent =
    "🤝 Hòa";
}

createBoard();
</script>
